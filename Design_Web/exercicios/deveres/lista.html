<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <title>Lista</title>
        <meta charset="utf-8">
    </head>
    <body>
        <h1>Lista não ordenada</h1>
        <ul>
            <li>Arroz</li>
            <li>Feijão</li>
            <li>Macarrão</li>
            <li>Leite</li>
            <li>Café</li>
        </ul>
        <h1>Lista ordenada</h1>
        <ol>
            <li>Acordar</li>
            <li>Escovar os dentes</li>
            <li>Tomar café</li>
            <li>Ir para a escola</li>
        </ol>
        <h1>Lista alinhada</h1>
        <ol>
            <li>Lanches
                <ul>
                    <li>X-burguer</li>
                    <li>X-salada</li>
                </ul>
            </li>
            <li>Bebidas
                <ul>
                    <li>Refrigerante</li>
                    <li>Suco</li>
                </ul>
            </li>
        </ol>
        <a href="index.html">Voltar ao início</a><br>
    </body>
</html>
